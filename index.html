<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a5f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="King ACC"><title>King Group ACC</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#eef1f5;color:#1e3a5f;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body><div id="m">กำลังโหลด King Group ACC...</div>
<script>
// หน้านี้ดึงหน้าจอแอปล่าสุดจาก Apps Script ทุกครั้ง (แก้แอปแล้วไม่ต้องอัป GitHub ซ้ำ)
var API='https://script.google.com/macros/s/AKfycbyBF_HG4_1-JkOWf7RwGOET5Yan-JGbaN0YssZe2KNpTGNztwoqSz2wa2IFe__RLb_7fw/exec';
function show(h){ document.open(); document.write(h); document.close(); }
function get(){ return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'source',args:[]}),redirect:'follow'})
  .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error); return j.result; }); }
get().then(function(h){ try{ localStorage.setItem('kg_src',h); }catch(e){} show(h); })
  .catch(function(e){ var c=null; try{ c=localStorage.getItem('kg_src'); }catch(x){}
    if(c) show(c); else document.getElementById('m').textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง ('+(e.message||e)+')'; });
</script></body></html>
